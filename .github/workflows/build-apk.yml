name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Find the project folder
        run: |
          ROOT=$(dirname "$(find . -name settings.gradle.kts -not -path '*/node_modules/*' | head -1)")
          if [ -z "$ROOT" ] || [ ! -d "$ROOT/app" ]; then
            echo "::error::Couldn't find the project's 'app' folder. Upload the app folder to the repo."
            ls -R . | head -50
            exit 1
          fi
          echo "Project folder: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing the GOOGLE_SERVICES_JSON secret."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$ROOT/app/google-services.json"
      - name: Build the APK
        run: cd "$ROOT" && gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" GoldBilling-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GoldBilling-apk
          path: GoldBilling-${{ github.run_number }}.apk
